[workspace]
members = ["louxna", "louxna-bin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.53.2", features = [
    "macros",
    "rt-multi-thread",
    "fs",
] }
mlua = { version = "0.12.1", features = [
    "send",
] }
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
indexmap = { version = "2.14.2", features = ["serde"] }
blake2 = "0.11.0"
async-stream = "0.3.6"
futures = "0.3.34"

louxna = { path = "louxna" }
